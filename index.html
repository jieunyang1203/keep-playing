<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>keep playing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 두 가지 모드 — 둘 다 화면 전체에 시소만
     live    폰: 실제 기울기(deviceorientation)로 시소를 움직임. ?room= 이 있으면 그 데스크톱으로 상태를 보냄
     mirror  데스크톱: 직접은 못 움직임. 오른쪽 아래 QR 을 폰으로 찍으면 그 폰 화면을 그대로 비춤
     ?live 로 데스크톱에서도 live 를 강제할 수 있음 */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #fff; overflow: hidden; }
  body { font-family: 'Pretendard Variable', Pretendard, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }

  .start { position: fixed; inset: 0; display: none; place-items: end center; padding-bottom: calc(18vh + env(safe-area-inset-bottom));
           font-size: 15px; letter-spacing: 0.01em; color: #151413; background: transparent; border: 0; font-family: inherit; }
  body.live.waiting .start { display: grid; }

  /* mirror 오른쪽 아래 QR — 폰으로 찍으면 그 폰이 이 화면과 연결됨. 연결되면 숨김 */
  .qr { position: fixed; right: 40px; bottom: 40px; width: 136px; height: 136px; display: none; }
  .qr svg { display: block; width: 100%; height: 100%; }
  body.has-room:not(.live):not(.paired) .qr { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="start" id="start" type="button">tap to play</button>
<div class="qr" id="qr"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ───────── 설정 — scene.js 의 E 선화와 같은 값 ───────── */
const CFG = {
  ink: '#151413',
  line: 1.2,                // 선 굵기 (px, 화면 기준)
  colors: '#8bbd57 #7b5cc0 #e07a3c #3f7fd0 #e5c23b #e0607e',   // 땅에 닿을 때마다 이 순서로 바뀌는 원 색
  lean: 15,                 // 세로 화면에서 판이 수직에서 기운 각도 (°) — 90° 만 돌리면 30°
  fill: 0.97,               // 시소 전체(원 포함)가 화면을 채우는 비율 (폰)
  fillDesk: 0.86,           // 데스크톱
  caption: 'the purpose of the game is simply to keep playing the game',
  // 기울기 → 시소
  sens: 0.09,               // 시작 자세에서 이만큼(sin) 기울이면 최대로 당김 (~5°)
  dead: 0.015,              // 이보다 작은 기울기는 무시 (가만히 들고 있으면 멈춤, ~1°)
  sideways: 0.7,            // 좌우로 기울여도 움직이게 — 판이 거의 세로라 원래는 좌우 기울기가 잘 안 먹힘
  accel: 18,                // 당기는 힘
  damp: 0.8,
  restitution: 0.22,        // 닿고 튕기는 정도
  // 닿는 세기 → 세게 닿을수록 원이 크게 튐
  bloom: 1,
  // 소리 — 색 하나 = 음 하나 (colors 와 같은 순서, Hz). 도레미솔라도 펜타토닉
  notes: [523.25, 587.33, 659.25, 783.99, 880, 1046.5],
  volume: 0.8,
};

const L = 1.8, P = 0.55, A = Math.asin(P / L), W_ = 0.24, TH = 0.06;   // 판 반 길이 · 받침 높이 · 최대 기울기 · 판 반 폭 · 두께 (m)
const R = L * Math.sin(A) * 1.18;                                       // 각 끝 아래 원 반지름
const pal = CFG.colors.split(/\s+/);
const params = new URLSearchParams(location.search);
const mobile = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
const LIVE = params.has('live') || params.has('room') || mobile;
document.body.classList.toggle('live', LIVE);

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cw = r.width; ch = r.height;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
}
addEventListener('resize', resize);

/* ───────── 장면 좌표 ─────────
   시소는 16:9 와 같은 가로 장면(아이소메트릭)으로 그리고, 세로 화면이면 통째로 돌려 얹음 (그녀가 잡은 방향:
   판이 오른쪽 위 ↔ 왼쪽 아래로 길게, 원은 세로로 긴 타원). 시계 방향 90° 면 판이 수직에서 30° 기울고,
   CFG.lean 만큼만 기울도록 덜 돌림. */
const C30 = Math.cos(Math.PI / 6);
const isoU = (x, y, z) => [(x - y) * C30, (x + y) * 0.5 - z];         // 1 m = 1 단위
function scenePts(phs) {   // 실제로 그리는 것 — 원 · 판 · 손잡이 (주어진 기울기들에서) 의 윤곽 점 (m 단위)
  const pts = [];
  for (const s of [-1, 1]) {
    for (let a = 0; a < 36; a++) { const t = a / 36 * Math.PI * 2; pts.push(isoU(s * L * Math.cos(A) + Math.cos(t) * R, Math.sin(t) * R, 0)); }
  }
  for (const ph of phs) {
    const c = Math.cos(ph), sn = Math.sin(ph);
    const Bm = (u, y, z) => isoU(u * c + z * sn, y, P - u * sn + z * c);
    for (const u of [-L, L]) for (const y of [-W_, W_]) for (const z of [0, TH + 0.03]) pts.push(Bm(u, y, z));
    for (const s2 of [-1, 1]) for (const y of [-W_ * 0.8, W_ * 0.8]) pts.push(Bm(s2 * L * 0.66, y, TH + 0.45));
  }
  return pts;
}
const allPts = scenePts([-A, 0, A]), levelPts = scenePts([0]);
const turn = (q, th) => [q[0] * Math.cos(th) - q[1] * Math.sin(th), q[0] * Math.sin(th) + q[1] * Math.cos(th)];
const box = (pts) => {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
};

function layout() {   // 회전 각 · 1 m 픽셀 · 원점 (화면 좌표 = 원점 + U × turn(장면 좌표))
  const th = ch > cw ? Math.PI / 2 - (30 - CFG.lean) * Math.PI / 180 : 0;   // 세로 화면(폰)만 돌림 — 데스크톱은 가로로 놓인 원래 장면
  const all = box(allPts.map((q) => turn(q, th))), lv = box(levelPts.map((q) => turn(q, th)));
  // 가운데 = 수평일 때 상자의 중심. 크기 = 그 중심에서 양쪽 끝까지 기울였을 때 가장 먼 곳까지가 화면 안에 들도록
  const mx = (lv.x0 + lv.x1) / 2, my = (lv.y0 + lv.y1) / 2;
  const hw = Math.max(mx - all.x0, all.x1 - mx), hh = Math.max(my - all.y0, all.y1 - my);
  const f = LIVE ? CFG.fill : CFG.fillDesk;
  const U = Math.min(cw * f / (2 * hw), (ch - (LIVE ? 0 : 90)) * f / (2 * hh));   // 데스크톱은 아래 문장 자리를 비움
  return { th, U, ox: cw / 2 - mx * U, oy: (ch - (LIVE ? 0 : 90)) / 2 - my * U };
}

/* ───────── 시소 물리 ─────────
   s: −1…+1, +1 = 왼쪽(−x) 끝이 땅에 닿음. 기울어진 쪽으로 당겨져 떨어지고, 끝에서 짧게 튕김.
   끝이 제법 빠르게 닿으면 '착지' — 그 끝 원의 색이 다음으로 바뀜. 안 기울이면 한쪽에 내려앉은 채 멈춤. */
const st = { s: 1, v: 0, hits: [0, 0], land: [-1e9, -1e9], k: [0, 0], armed: [true, true] };   // hits[0] 왼쪽, [1] 오른쪽 · land 착지 시각(ms) · k 착지 세기 0…1
const colorOf = (i) => (st.hits[i] + (i ? 3 : 0)) % pal.length;     // 그 끝 원의 지금 색 (오른쪽은 팔레트 3칸 밀림)
function step(dt, input, now) {
  const g = Math.abs(input) < CFG.dead ? 0 : input;
  st.v += (CFG.accel * g - CFG.damp * st.v) * dt;
  st.s += st.v * dt;
  if (st.s < 0.5) st.armed[0] = true;   // 반 넘게 떠났다 와야 다음 착지로 셈 (튕겼다 다시 떨어지는 건 안 셈)
  if (st.s > -0.5) st.armed[1] = true;
  for (const e of [1, -1]) {
    if (st.s * e > 1) {
      st.s = e;
      const imp = st.v * e;
      const i = e > 0 ? 0 : 1;
      if (imp > 0.9 && st.armed[i]) {   // 착지
        const k = clamp01((imp - 0.9) / 7.5);   // 끝까지 확 기울이면 ~0.9, 살살이면 ~0.4
        st.armed[i] = false; st.hits[i]++; st.land[i] = now; st.k[i] = k;
        sound(i, k, colorOf(i));
        if (LIVE && navigator.vibrate) navigator.vibrate(Math.round(8 + 22 * k));
      }
      st.v = imp > 0.9 ? -st.v * CFG.restitution : 0;
    }
  }
}

const clamp01 = (v) => Math.min(1, Math.max(0, v));

/* ───────── 소리 ─────────
   닿을 때: 낮은 '툭' (사인 110→48Hz 로 떨어지는 짧은 음) + 그 끝 원의 새 색에 맞는 음 (마림바처럼 4배음이 빨리 사라짐).
   세게 닿을수록 크게. 왼쪽 끝(화면 위·오른쪽)은 오른쪽 스피커로 조금, 반대 끝은 왼쪽으로.
   브라우저는 사용자가 한 번 누르기 전엔 소리를 막아서, 첫 탭/클릭 때 켬. */
let ac = null;
function unlockAudio() {
  try {
    // iOS: 'playback' 이면 무음 스위치가 켜져 있어도 소리가 남 (Safari 17+, 기본값은 무음 스위치를 따름)
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state !== 'running') ac.resume();
    // iOS 는 탭하는 그 순간 실제로 뭔가를 재생해야 소리를 열어 줌 — 들리지 않는 아주 짧은 소리 하나
    const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
  } catch (_) { ac = null; }
}
function sound(i, k, ci) {
  if (!ac) return;
  if (ac.state !== 'running') { ac.resume(); return; }   // iOS 는 전화·잠금 뒤 'interrupted' 가 됨
  const t = ac.currentTime, out = ac.createGain(), pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  out.gain.value = CFG.volume;
  if (pan) { pan.pan.value = i ? -0.35 : 0.35; out.connect(pan); pan.connect(ac.destination); } else out.connect(ac.destination);
  const tone = (f, f2, peak, dur, type = 'sine') => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
  };
  tone(110, 48, 0.12 + 0.35 * k, 0.16);                         // 툭
  const f = CFG.notes[ci % CFG.notes.length];
  tone(f, 0, 0.05 + 0.16 * k, 0.7 + 0.8 * k);                   // 색의 음
  tone(f * 4, 0, 0.02 + 0.05 * k, 0.12);                        // 맑은 배음 (금방 사라짐)
}

/* 기울기 입력: 화면 평면 위 중력 방향(시작할 때 자세를 0 으로) 을 판 방향(화면에서 오른쪽 끝 → 왼쪽 끝)에 투영 */
function plankDir(Lo) {
  const a = turn(isoU(-L * Math.cos(A), 0, P), Lo.th), b = turn(isoU(L * Math.cos(A), 0, P), Lo.th);
  const dx = a[0] - b[0], dy = a[1] - b[1], n = Math.hypot(dx, dy) || 1;
  return [dx / n, dy / n];
}
/** 화면 좌표계에서 본 중력의 기울기 성분 (x 오른쪽, y 아래쪽) */
// (예전: sin(beta) 를 그대로 쓰면 폰을 세워 들었을 때(beta ≈ 70–90°) 값이 거의 안 변해서 둔했음 → 시작 자세와의 각도 차이로)
const wrap = (a) => ((a + 540) % 360) - 180;
const tiltOf = (o, b) => [Math.sin(wrap(o.gamma - b.gamma) * Math.PI / 180), Math.sin(wrap(o.beta - b.beta) * Math.PI / 180)];

/* ───────── 그리기 — scene.js HTB.E 와 같은 화법 ───────── */
function draw(now) {
  const Lo = layout();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(Lo.ox, Lo.oy); ctx.rotate(Lo.th);
  const U = Lo.U;
  const iso = (x, y, z) => { const q = isoU(x, y, z); return [q[0] * U, q[1] * U]; };
  const phi = st.s * A;                                               // + = 왼쪽이 내려감
  ctx.lineWidth = CFG.line; ctx.strokeStyle = CFG.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const face = (pts) => { ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); };
  const line = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };

  // 땅에 눕힌 원 — 각 끝이 닿을 때마다 다음 색. 닿는 순간 세기만큼 원이 튐 (퍼지는 고리는 그녀 요청으로 뺌)
  const ring = (cxm, r) => {
    ctx.beginPath();
    for (let a = 0; a <= 72; a++) {
      const t = a / 72 * Math.PI * 2, q = iso(cxm + Math.cos(t) * r, Math.sin(t) * r, 0);
      a ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
    }
    ctx.closePath();
  };
  for (const s2 of [-1, 1]) {
    const i = s2 < 0 ? 0 : 1, col = pal[colorOf(i)], cxm = s2 * L * Math.cos(A);
    const tau = (now - st.land[i]) / 1000, k = st.k[i] * CFG.bloom;
    // 원: 닿는 순간 1 + 0.22k 배로 튀었다가 0.25초 안에 돌아옴
    ring(cxm, R * (1 + 0.22 * k * Math.exp(-Math.max(0, tau) / 0.08) * (tau >= 0 ? 1 : 0)));
    ctx.fillStyle = col; ctx.fill();
  }
  ctx.strokeStyle = CFG.ink; ctx.lineWidth = CFG.line;

  // 받침: 삼각 기둥
  const fw = 0.22, fd = 0.3;
  face([iso(-fw, -fd, 0), iso(0, -fd, P), iso(0, fd, P), iso(-fw, fd, 0)]);
  face([iso(fw, -fd, 0), iso(0, -fd, P), iso(0, fd, P), iso(fw, fd, 0)]);
  face([iso(-fw, fd, 0), iso(0, fd, P), iso(fw, fd, 0)]);

  // 판
  const c = Math.cos(phi), sn = Math.sin(phi);
  const B = (u, y, z) => iso(u * c + z * sn, y, P - u * sn + z * c);
  face([B(-L, W_, 0), B(L, W_, 0), B(L, W_, TH), B(-L, W_, TH)]);
  face([B(L, -W_, 0), B(L, W_, 0), B(L, W_, TH), B(L, -W_, TH)]);
  face([B(-L, -W_, TH), B(L, -W_, TH), B(L, W_, TH), B(-L, W_, TH)]);
  for (const s2 of [-1, 1]) {
    const u0 = s2 * L * 0.86;
    face([B(u0 - 0.28, -W_ * 0.9, TH + 0.03), B(u0 + 0.28, -W_ * 0.9, TH + 0.03), B(u0 + 0.28, W_ * 0.9, TH + 0.03), B(u0 - 0.28, W_ * 0.9, TH + 0.03)]);
    const uh = s2 * L * 0.66;
    line(B(uh, -W_ * 0.7, TH), B(uh, -W_ * 0.7, TH + 0.45));
    line(B(uh, W_ * 0.7, TH), B(uh, W_ * 0.7, TH + 0.45));
    line(B(uh, -W_ * 0.8, TH + 0.45), B(uh, W_ * 0.8, TH + 0.45));
  }
  ctx.restore();

  // 문장 — 돌리지 않고 화면 아래에 작게
  const size = Math.max(10, Math.min(LIVE ? 14 : 22, cw / 30));   // 데스크톱은 조금 크게
  ctx.font = `500 ${size}px 'Pretendard Variable', Pretendard, sans-serif`;
  ctx.fillStyle = CFG.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(CFG.caption, cw / 2, ch - Math.max(28, ch * 0.045));
  return Lo;
}

/* ───────── 입력 ───────── */
// live: 실제 기울기. 처음 탭(iOS 권한)한 순간의 자세를 0 으로
let ori = null, base = null;   // 지금 / 시작 자세의 { beta, gamma } (°)
function onOri(e) {
  if (e.beta == null) return;
  ori = { beta: e.beta, gamma: e.gamma || 0 };
  if (!base) base = { ...ori };
}
async function begin() {
  unlockAudio();
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
  } catch (_) { return; }
  addEventListener('deviceorientation', onOri);
  base = null;
  document.body.classList.remove('waiting');
}
if (LIVE) {
  document.body.classList.add('waiting');
  document.getElementById('start').addEventListener('click', begin);
  canvas.addEventListener('dblclick', () => { base = null; });   // 두 번 탭: 지금 자세를 다시 0 으로
}

addEventListener('pointerdown', unlockAudio);   // 아무 데나 누르면 소리 켜짐 (mirror 의 첫 클릭, live 에서 소리가 끊겼을 때 다시 탭)
addEventListener('touchend', unlockAudio);

/* ───────── 폰 ↔ 데스크톱 ─────────
   데스크톱(mirror): 방 번호를 만들고 QR 에 '?room=방' 주소를 담음. 폰이 보내는 상태(시소 위치 · 착지 횟수 · 세기)를 그대로 그림.
   폰(live + room): 매 프레임 상태를 두 길로 동시에 보냄 — 데스크톱은 먼저 도착한 것(번호가 더 큰 것)만 씀.
     ① PeerJS: 폰↔데스크톱 직접 (빠름). 네트워크에 따라 직접 연결이 막힐 때가 있음
     ② 공개 MQTT 브로커(EMQX)를 거쳐 전달: 조금 느리지만 거의 어디서나 됨 (10-25 실제 폰에서 ① 이 안 붙어서 추가) */
const ROOM = params.get('room');
const BROKER = 'wss://broker.emqx.io:8084/mqtt', TOPIC = (id) => 'keepplaying/v1/' + id;
let conn = null, mq = null, remote = null, remoteAt = -1e9, seq = 0, lastSeq = -1;
function receive(m) {
  if (!m || typeof m.n !== 'number') return;
  if (performance.now() - remoteAt < 1500 && m.n <= lastSeq) return;   // 다른 길로 늦게 온 옛 상태는 버림 (끊겼다 새로 열린 폰은 번호가 0 부터라 받음)
  lastSeq = m.n; remote = m; remoteAt = performance.now();
}
function hostRoom() {
  const id = 'keepplaying-' + Math.random().toString(36).slice(2, 10);
  const url = location.origin + location.pathname + '?room=' + id;
  if (typeof qrcode !== 'undefined') {
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }
  document.getElementById('qr').dataset.url = url;
  document.body.classList.add('has-room');
  // ② MQTT
  if (typeof mqtt !== 'undefined') {
    mq = mqtt.connect(BROKER, { reconnectPeriod: 2000, clean: true });
    mq.on('connect', () => mq.subscribe(TOPIC(id)));
    mq.on('message', (_, buf) => { try { receive(JSON.parse(buf.toString())); } catch (_) {} });
  }
  // ① PeerJS
  if (typeof Peer !== 'undefined') {
    const peer = new Peer(id);
    peer.on('connection', (c) => {
      if (conn) conn.close();
      conn = c;
      c.on('data', receive);
      c.on('close', () => { if (conn === c) conn = null; });
    });
    peer.on('disconnected', () => peer.reconnect());
  }
}
function joinRoom() {
  if (typeof mqtt !== 'undefined' && !mq) mq = mqtt.connect(BROKER, { reconnectPeriod: 2000, clean: true });
  if (typeof Peer === 'undefined') return;
  const peer = new Peer();
  peer.on('open', () => {
    const c = peer.connect(ROOM, { reliable: false });
    c.on('open', () => { conn = c; });
    c.on('close', () => { if (conn === c) conn = null; peer.destroy(); setTimeout(joinRoom, 1500); });
  });
  peer.on('error', (e) => { if (e.type === 'peer-unavailable' || e.type === 'network') { peer.destroy(); setTimeout(joinRoom, 3000); } });
}
if (LIVE && ROOM) joinRoom();
if (!LIVE) hostRoom();

/** 폰 → 데스크톱 한 프레임 상태. MQTT 는 1초에 30번만 (공개 브로커라 너무 잦으면 막힐 수 있음) */
let mqAt = 0;
function sendState(now) {
  if (!ROOM) return;
  const m = { n: ++seq, s: +st.s.toFixed(4), h: st.hits, k: st.k.map((k) => +k.toFixed(3)) };
  if (conn && conn.open) conn.send(m);
  if (mq && mq.connected && now - mqAt > 33) { mqAt = now; mq.publish(TOPIC(ROOM), JSON.stringify(m), { qos: 0 }); }
}
/** 데스크톱: 받은 상태를 그대로 적용. 착지 횟수가 늘면 그때 원이 튀고 소리 (데스크톱도 한 번 클릭해 두면 소리 남) */
function applyRemote(now) {
  const m = remote;
  st.s += (m.s - st.s) * 0.45;   // 중계(MQTT)로 오면 1초 30번이라 그 사이를 부드럽게 이음
  for (const i of [0, 1]) if (m.h[i] !== st.hits[i]) {
    const landed = m.h[i] > st.hits[i];
    st.hits[i] = m.h[i]; st.k[i] = m.k[i];
    if (landed) { st.land[i] = now; sound(i, m.k[i], colorOf(i)); }
  }
}

/* ───────── 루프 ───────── */
let last = performance.now(), Lo = null;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!cw) resize();
  if (!LIVE) {   // mirror: 폰이 보내는 동안만 움직이고, 아니면 그 자리에 멈춰 있음
    const paired = remote && now - remoteAt < 1500;
    document.body.classList.toggle('paired', !!paired);
    if (paired) applyRemote(now);
  } else if (Lo) {
    const d = plankDir(Lo);
    let input = 0;
    if (ori && base) {
      const t = tiltOf(ori, base), dx = Math.sign(d[0] || 1) * Math.max(Math.abs(d[0]), CFG.sideways);
      input = (t[0] * dx + t[1] * d[1]) / CFG.sens;
    }
    step(dt, Math.max(-1, Math.min(1, input)), now);
    sendState(now);
  }
  Lo = draw(now);
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => { resize(); requestAnimationFrame(frame); });
</script>
</body>
