<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>keep playing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400&display=swap">
<style>
  /* 영문 PP Radio Grotesk — 무료 개인용 라이선스는 공개 웹사이트 사용·파일 공개 업로드를 금지(EULA 2.1, 2.6)해서
     fonts/ 는 git 에 올리지 않음(.gitignore). 로컬 서버에서만 이 글꼴, GitHub Pages 에서는 Hanken Grotesk 로 대체 */
  @font-face { font-family: 'PP Radio Grotesk'; src: url('fonts/PPRadioGrotesk-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }

  /* 두 가지 모드 — 둘 다 화면 전체에 시소만
     live    폰: 실제 기울기(deviceorientation)로 시소를 움직임. ?room= 이 있으면 그 데스크톱으로 상태를 보냄
     mirror  데스크톱: 직접은 못 움직임. 오른쪽 아래 QR 을 폰으로 찍으면 그 폰 화면을 그대로 비춤
     ?live 로 데스크톱에서도 live 를 강제할 수 있음
     색: 닿을 때마다 판(+받침) · 배경(+그림자) 이 번갈아 팔레트 안에서 다음 색으로, 글자는 판 색 (--bg, --text 는 매번 JS 가 갱신) */
  :root { --bg: #98fb9e; --text: #8ebafa; --qr: #2f5a33; --font: 'PP Radio Grotesk', 'Hanken Grotesk', sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--font); -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }

  .start { position: fixed; inset: 0; display: none; place-items: end center; padding-bottom: calc(36px + env(safe-area-inset-bottom));
           font-size: 24px; letter-spacing: -0.01em; color: var(--text); background: transparent; border: 0; font-family: var(--font); }
  body.live.waiting .start { display: grid; }

  /* mirror 오른쪽 아래 QR — 점과 둥근 모서리. 색은 팔레트에서 배경과 가장 대비되는 색을, 찍힐 만큼 진하게 */
  .qr { position: fixed; right: 40px; bottom: 40px; width: 132px; height: 132px; display: none; color: var(--qr); }
  .qr svg { display: block; width: 100%; height: 100%; }
  body.has-room:not(.live):not(.paired) .qr { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="start" id="start" type="button">tap to play</button>
<div class="qr" id="qr"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ───────── 설정 ───────── */
const CFG = {
  // 네온 파스텔 팔레트 (그녀 시안: 민트 배경 · 페리윙클 판 · 카키 받침). 착지할 때마다 요소 하나씩 이 안에서 바뀜
  palette: ['#98fb9e', '#8ebafa', '#b9ae8b', '#c9a7ff', '#ffa3d6', '#eef57c', '#ff9a78', '#84ece2'],
  start: { bg: 0, plank: 1, base: 2, shadow: 7 },        // 처음 색 (palette 번호). 글자는 판과 같은 색
  // 닿을 때마다 번갈아: 판(+받침) → 배경(+그림자) → 판(+받침) … — 매번 큰 면이 바뀌어 눈에 보이게
  steps: [['plank', 'base'], ['bg', 'shadow']],
  jump: 3,                                               // 팔레트에서 몇 칸 건너뛴 색으로 (가까운 색끼리만 돌지 않게)
  lean: 15,                 // 세로 화면에서 판이 수직에서 기운 각도 (°) — 90° 만 돌리면 30°
  fill: 0.92,               // 시소가 남은 화면을 채우는 비율 (폰)
  fillDesk: 0.96,           // 데스크톱
  caption: 'The purpose of the game is to keep playing the game',
  // 기울기 → 시소
  sens: 0.09,               // 시작 자세에서 이만큼(sin) 기울이면 최대로 당김 (~5°)
  dead: 0.015,              // 이보다 작은 기울기는 무시 (가만히 들고 있으면 멈춤, ~1°)
  sideways: 0.7,            // 좌우로 기울여도 움직이게 — 판이 거의 세로라 원래는 좌우 기울기가 잘 안 먹힘
  accel: 18,                // 당기는 힘
  damp: 0.8,
  restitution: 0.22,        // 닿고 튕기는 정도
  // 소리 — 새로 바뀐 색 하나 = 음 하나 (palette 와 같은 순서, Hz). 펜타토닉 C5–E6
  notes: [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51],
  volume: 0.8,
};

const L = 1.8, P = 0.55, A = Math.asin(P / L), W_ = 0.26, TH = 0.1;   // 판 반 길이 · 받침 높이 · 최대 기울기 · 판 반 폭 · 두께 (m)
const FW = 0.3, FD = 0.32;                                              // 받침 반 폭 · 반 깊이
const params = new URLSearchParams(location.search);
const mobile = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
const LIVE = params.has('live') || params.has('room') || params.has('r') || mobile;
document.body.classList.toggle('live', LIVE);

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cw = r.width; ch = r.height;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
}
addEventListener('resize', resize);

/* ───────── 색 ─────────
   총 착지 횟수 n 만으로 정해짐 → 폰과 데스크톱이 같은 n 이면 같은 색. 어느 끝이든 닿을 때마다 CFG.steps 를 번갈아
   판(+받침) 또는 배경(+그림자) 이 팔레트에서 jump 칸 건너뛴 색으로 바뀜 (서로 붙는 면끼리 같은 색은 건너뜀). */
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (c) => '#' + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const shade = (h, k) => rgb2hex(hex2rgb(h).map((v) => v * k));          // 면 그늘: 같은 색을 k 배로 어둡게
const lum = (h) => { const c = hex2rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const paletteCache = [{ ...CFG.start }];
function colorsAt(n) {
  const N = CFG.palette.length;
  while (paletteCache.length <= n) {
    const prev = paletteCache[paletteCache.length - 1], c = { ...prev }, i = paletteCache.length - 1;
    for (const el of CFG.steps[i % CFG.steps.length]) {
      // 겹치면 안 되는 짝: 배경 ↔ 전부, 판 ↔ 받침 · 그림자
      const clash = { bg: ['plank', 'base', 'shadow'], plank: ['bg', 'base', 'shadow'], base: ['bg', 'plank'], shadow: ['bg', 'plank'] }[el];
      let v = (prev[el] + CFG.jump) % N;
      for (let t = 0; t < N && clash.some((o) => c[o] === v); t++) v = (v + 1) % N;
      c[el] = v;
    }
    c.changed = c[CFG.steps[i % CFG.steps.length][0]];
    paletteCache.push(c);
  }
  return paletteCache[n];
}
/** QR 색: 팔레트에서 배경과 가장 대비되는 색을, 대비 4.5 가 될 때까지 진하게 (파스텔끼리는 휴대폰 카메라가 못 읽음) */
function qrColor(bg) {
  let best = CFG.palette.reduce((a, b) => (contrast(b, bg) > contrast(a, bg) ? b : a));
  for (let k = 1; k > 0.1 && contrast(best, bg) < 4.5; k -= 0.05) best = shade(best, 0.92);
  return best;
}

/* ───────── 장면 좌표 ─────────
   시소는 아이소메트릭 가로 장면으로 그리고, 세로 화면(폰)이면 통째로 돌려 얹음 (판이 수직에서 CFG.lean 만큼 기움).
   데스크톱은 가로로 놓인 원래 장면. */
const C30 = Math.cos(Math.PI / 6);
const isoU = (x, y, z) => [(x - y) * C30, (x + y) * 0.5 - z];         // 1 m = 1 단위
function scenePts(phs) {   // 그리는 것 — 판 · 땅 그림자 · 받침 (주어진 기울기들에서) 의 윤곽 점 (m 단위)
  const pts = [];
  for (const x of [-FW, FW]) for (const y of [-FD, FD]) pts.push(isoU(x, y, 0));
  for (const ph of phs) {
    const c = Math.cos(ph), sn = Math.sin(ph);
    const Bm = (u, y, z) => isoU(u * c + z * sn, y, P - u * sn + z * c);
    for (const u of [-L, L]) for (const y of [-W_, W_]) {
      for (const z of [0, TH + 0.04]) pts.push(Bm(u, y, z));
      pts.push(isoU(u * c, y, 0));
    }
  }
  return pts;
}
const allPts = scenePts([-A, 0, A]), levelPts = scenePts([0]);
const turn = (q, th) => [q[0] * Math.cos(th) - q[1] * Math.sin(th), q[0] * Math.sin(th) + q[1] * Math.cos(th)];
const box = (pts) => {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
};

/* 문장: 데스크톱만. 화면 맨 위에 붙여 한 줄로, 좌우·위 여백이 거의 같게 (폰은 시소만) */
function captionLayout() {
  if (LIVE) return null;
  const font = (sz) => `400 ${sz}px ${getComputedStyle(document.body).getPropertyValue('--font')}`;
  const m = Math.max(12, cw * 0.022);                                     // 위 · 좌우 여백
  ctx.font = font(100);
  const mt = ctx.measureText(CFG.caption), sz = (cw - 2 * m) / (mt.width / 100);
  ctx.font = font(sz);
  const t = ctx.measureText(CFG.caption);
  // 글자 윗면(대문자 T 꼭대기)을 여백 m 에 맞춤
  return { font: font(sz), x: cw / 2, y: m + t.actualBoundingBoxAscent, bottom: m + t.actualBoundingBoxAscent + t.actualBoundingBoxDescent };
}

function layout(cap) {   // 회전 각 · 1 m 픽셀 · 원점 (화면 좌표 = 원점 + U × turn(장면 좌표))
  const th = ch > cw ? Math.PI / 2 - (30 - CFG.lean) * Math.PI / 180 : 0;
  const all = box(allPts.map((q) => turn(q, th))), lv = box(levelPts.map((q) => turn(q, th)));
  // 가운데 = 수평일 때 상자의 중심. 크기 = 그 중심에서 양쪽 끝까지 기울였을 때 가장 먼 곳까지가 남은 영역 안에 들도록
  const top = cap ? cap.bottom + ch * 0.02 : 56, bottom = LIVE ? 84 : ch * 0.03;   // 폰: 위 다이내믹 아일랜드 · 아래 'tap to play' 자리
  const aw = cw, ah = ch - top - bottom;
  const mx = (lv.x0 + lv.x1) / 2, my = (lv.y0 + lv.y1) / 2;
  const hw = Math.max(mx - all.x0, all.x1 - mx), hh = Math.max(my - all.y0, all.y1 - my);
  const f = LIVE ? CFG.fill : CFG.fillDesk;
  const U = Math.min(aw * f / (2 * hw), ah * f / (2 * hh));
  return { th, U, ox: aw / 2 - mx * U, oy: top + ah / 2 - my * U };
}

/* ───────── 시소 물리 ─────────
   s: −1…+1, +1 = 왼쪽(−x) 끝이 땅에 닿음. 기울어진 쪽으로 당겨져 떨어지고, 끝에서 짧게 튕김.
   끝이 제법 빠르게 닿으면 '착지' — 요소 하나의 색이 바뀌고 소리. 안 기울이면 한쪽에 내려앉은 채 멈춤. */
const st = { s: 1, v: 0, hits: [0, 0], k: [0, 0], armed: [true, true] };   // hits[0] 왼쪽, [1] 오른쪽 · k 착지 세기 0…1
const clamp01 = (v) => Math.min(1, Math.max(0, v));
function step(dt, input, now) {
  const g = Math.abs(input) < CFG.dead ? 0 : input;
  st.v += (CFG.accel * g - CFG.damp * st.v) * dt;
  st.s += st.v * dt;
  if (st.s < 0.5) st.armed[0] = true;   // 반 넘게 떠났다 와야 다음 착지로 셈 (튕겼다 다시 떨어지는 건 안 셈)
  if (st.s > -0.5) st.armed[1] = true;
  for (const e of [1, -1]) {
    if (st.s * e > 1) {
      st.s = e;
      const imp = st.v * e;
      const i = e > 0 ? 0 : 1;
      if (imp > 0.9 && st.armed[i]) {   // 착지
        const k = clamp01((imp - 0.9) / 7.5);   // 끝까지 확 기울이면 ~0.9, 살살이면 ~0.4
        st.armed[i] = false; st.hits[i]++; st.k[i] = k;
        sound(i, k, colorsAt(st.hits[0] + st.hits[1]).changed);
        if (LIVE && navigator.vibrate) navigator.vibrate(Math.round(8 + 22 * k));
      }
      st.v = imp > 0.9 ? -st.v * CFG.restitution : 0;
    }
  }
}

/* ───────── 소리 ─────────
   닿을 때: 낮은 '툭' (사인 110→48Hz 로 떨어지는 짧은 음) + 새로 바뀐 색에 맞는 음 (마림바처럼 4배음이 빨리 사라짐).
   세게 닿을수록 크게. 브라우저는 사용자가 한 번 누르기 전엔 소리를 막아서, 첫 탭/클릭 때 켬. */
let ac = null;
function unlockAudio() {
  try {
    // iOS: 'playback' 이면 무음 스위치가 켜져 있어도 소리가 남 (Safari 17+, 기본값은 무음 스위치를 따름)
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state !== 'running') ac.resume();
    // iOS 는 탭하는 그 순간 실제로 뭔가를 재생해야 소리를 열어 줌 — 들리지 않는 아주 짧은 소리 하나
    const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
  } catch (_) { ac = null; }
}
function sound(i, k, ci) {
  if (!ac) return;
  if (ac.state !== 'running') { ac.resume(); return; }   // iOS 는 전화·잠금 뒤 'interrupted' 가 됨
  const t = ac.currentTime, out = ac.createGain(), pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  out.gain.value = CFG.volume;
  if (pan) { pan.pan.value = i ? -0.35 : 0.35; out.connect(pan); pan.connect(ac.destination); } else out.connect(ac.destination);
  const tone = (f, f2, peak, dur, type = 'sine') => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
  };
  tone(110, 48, 0.12 + 0.35 * k, 0.16);                         // 툭
  const f = CFG.notes[ci % CFG.notes.length];
  tone(f, 0, 0.05 + 0.16 * k, 0.7 + 0.8 * k);                   // 색의 음
  tone(f * 4, 0, 0.02 + 0.05 * k, 0.12);                        // 맑은 배음 (금방 사라짐)
}

/* 기울기 입력: 시작 자세에서 기운 정도를 판 방향(화면에서 오른쪽 끝 → 왼쪽 끝)에 투영 */
function plankDir(Lo) {
  const a = turn(isoU(-L * Math.cos(A), 0, P), Lo.th), b = turn(isoU(L * Math.cos(A), 0, P), Lo.th);
  const dx = a[0] - b[0], dy = a[1] - b[1], n = Math.hypot(dx, dy) || 1;
  return [dx / n, dy / n];
}
// 화면 좌표계에서 본 기울기 (x 오른쪽, y 아래쪽). sin(beta) 를 그대로 쓰면 폰을 세워 들었을 때 거의 안 변해서 각도 차이로
const wrap = (a) => ((a + 540) % 360) - 180;
const tiltOf = (o, b) => [Math.sin(wrap(o.gamma - b.gamma) * Math.PI / 180), Math.sin(wrap(o.beta - b.beta) * Math.PI / 180)];

/* ───────── 그리기 — 아이소메트릭 면을 색으로 채움 (선 없음). 윗면 = 요소 색, 옆면은 같은 색을 어둡게 ───────── */
let shownN = -1;
function draw(now) {
  const n = st.hits[0] + st.hits[1], C = colorsAt(n), pal = CFG.palette;
  const bg = pal[C.bg], plank = pal[C.plank], base = pal[C.base], shadowC = pal[C.shadow], text = plank;
  if (n !== shownN) {   // CSS 쪽 (탭 투 플레이 · 바탕 · QR) 도 같은 색으로
    shownN = n;
    const s = document.documentElement.style;
    s.setProperty('--bg', bg); s.setProperty('--text', text); s.setProperty('--qr', qrColor(bg));
  }
  const cap = captionLayout(), Lo = layout(cap);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(Lo.ox, Lo.oy); ctx.rotate(Lo.th);
  const U = Lo.U;
  const iso = (x, y, z) => { const q = isoU(x, y, z); return [q[0] * U, q[1] * U]; };
  const phi = st.s * A;                                               // + = 왼쪽이 내려감
  const c = Math.cos(phi), sn = Math.sin(phi);
  const B = (u, y, z) => iso(u * c + z * sn, y, P - u * sn + z * c);   // 판 좌표 → 화면 (u 판 길이, z 판 두께)
  const poly = (pts, col) => { ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); };

  // 땅 그림자: 판을 바로 아래 땅에 눌러 놓은 모양 + 받침 발치 (팔레트 색)
  poly([iso(-L * c, -W_, 0), iso(L * c, -W_, 0), iso(L * c, W_, 0), iso(-L * c, W_, 0)], shadowC);
  poly([iso(-FW * 1.25, -FD * 1.1, 0), iso(FW * 1.25, -FD * 1.1, 0), iso(FW * 1.25, FD * 1.1, 0), iso(-FW * 1.25, FD * 1.1, 0)], shadowC);

  // 받침: 삼각 기둥 — 면 사이 명암은 아주 조금만 (플랫하게, 형태만 읽히게)
  poly([iso(-FW, -FD, 0), iso(0, -FD, P), iso(0, FD, P), iso(-FW, FD, 0)], base);
  poly([iso(FW, -FD, 0), iso(0, -FD, P), iso(0, FD, P), iso(FW, FD, 0)], shade(base, 0.93));
  poly([iso(-FW, FD, 0), iso(0, FD, P), iso(FW, FD, 0)], shade(base, 0.86));

  // 판: 앞 옆면 · 오른쪽 끝면 · 윗면 (손잡이 · 좌석은 뺌)
  poly([B(-L, W_, 0), B(L, W_, 0), B(L, W_, TH), B(-L, W_, TH)], shade(plank, 0.88));
  poly([B(L, -W_, 0), B(L, W_, 0), B(L, W_, TH), B(L, -W_, TH)], shade(plank, 0.82));
  poly([B(-L, -W_, TH), B(L, -W_, TH), B(L, W_, TH), B(-L, W_, TH)], plank);
  ctx.restore();

  // 문장 — 데스크톱만, 화면 맨 위
  if (cap) { ctx.font = cap.font; ctx.fillStyle = text; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(CFG.caption, cap.x, cap.y); }
  return Lo;
}

/* ───────── QR — 점 모듈 + 둥근 사각 파인더. 주소를 짧게(?r=4글자) 해서 칸 수를 29×29 로 (currentColor 라 CSS --qr 로 색이 바뀜) ───────── */
function qrSvg(text) {
  const q = qrcode(0, 'L'); q.addData(text); q.make();   // L: 오류 복구를 낮춰 칸 수를 줄임 (화면에서 바로 찍으니 충분)
  const n = q.getModuleCount(), finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  let dots = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x) && !finder(x, y)) dots += `<circle cx="${x + 0.5}" cy="${y + 0.5}" r="0.47"/>`;
  const eye = (x, y) => `<rect x="${x + 0.5}" y="${y + 0.5}" width="6" height="6" rx="1.9" fill="none" stroke="currentColor" stroke-width="1"/>` +
    `<rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx="0.9"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" fill="currentColor">${dots}${eye(0, 0)}${eye(n - 7, 0)}${eye(0, n - 7)}</svg>`;
}

/* ───────── 입력 ───────── */
// live: 실제 기울기. 처음 탭(iOS 권한)한 순간의 자세를 0 으로
let ori = null, base = null;   // 지금 / 시작 자세의 { beta, gamma } (°)
function onOri(e) {
  if (e.beta == null) return;
  ori = { beta: e.beta, gamma: e.gamma || 0 };
  if (!base) base = { ...ori };
}
async function begin() {
  unlockAudio();
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
  } catch (_) { return; }
  addEventListener('deviceorientation', onOri);
  base = null;
  document.body.classList.remove('waiting');
}
if (LIVE) {
  document.body.classList.add('waiting');
  document.getElementById('start').addEventListener('click', begin);
  canvas.addEventListener('dblclick', () => { base = null; });   // 두 번 탭: 지금 자세를 다시 0 으로
}

addEventListener('pointerdown', unlockAudio);   // 아무 데나 누르면 소리 켜짐 (mirror 의 첫 클릭, live 에서 소리가 끊겼을 때 다시 탭)
addEventListener('touchend', unlockAudio);

/* ───────── 폰 ↔ 데스크톱 ─────────
   데스크톱(mirror): 방 번호를 만들고 QR 에 '?room=방' 주소를 담음. 폰이 보내는 상태(시소 위치 · 착지 횟수 · 세기)를 그대로 그림.
   폰(live + room): 매 프레임 상태를 두 길로 동시에 보냄 — 데스크톱은 먼저 도착한 것(번호가 더 큰 것)만 씀.
     ① PeerJS: 폰↔데스크톱 직접 (빠름). 네트워크에 따라 직접 연결이 막힐 때가 있음
     ② 공개 MQTT 브로커(EMQX)를 거쳐 전달: 조금 느리지만 거의 어디서나 됨 (10-25 실제 폰에서 ① 이 안 붙어서 추가) */
const ROOM = params.get('r') ? 'keepplaying-' + params.get('r') : params.get('room');   // QR 주소엔 짧은 r 만
const BROKER = 'wss://broker.emqx.io:8084/mqtt', TOPIC = (id) => 'keepplaying/v1/' + id;
let conn = null, mq = null, remote = null, remoteAt = -1e9, seq = 0, lastSeq = -1;
function receive(m) {
  if (!m || typeof m.n !== 'number') return;
  if (performance.now() - remoteAt < 1500 && m.n <= lastSeq) return;   // 다른 길로 늦게 온 옛 상태는 버림 (끊겼다 새로 열린 폰은 번호가 0 부터라 받음)
  lastSeq = m.n; remote = m; remoteAt = performance.now();
}
function hostRoom() {
  const r = Math.random().toString(36).slice(2, 6), id = 'keepplaying-' + r;
  const url = location.origin + location.pathname + '?r=' + r;
  if (typeof qrcode !== 'undefined') document.getElementById('qr').innerHTML = qrSvg(url);
  document.getElementById('qr').dataset.url = url;
  document.body.classList.add('has-room');
  // ② MQTT
  if (typeof mqtt !== 'undefined') {
    mq = mqtt.connect(BROKER, { reconnectPeriod: 2000, clean: true });
    mq.on('connect', () => mq.subscribe(TOPIC(id)));
    mq.on('message', (_, buf) => { try { receive(JSON.parse(buf.toString())); } catch (_) {} });
  }
  // ① PeerJS
  if (typeof Peer !== 'undefined') {
    const peer = new Peer(id);
    peer.on('connection', (c) => {
      if (conn) conn.close();
      conn = c;
      c.on('data', receive);
      c.on('close', () => { if (conn === c) conn = null; });
    });
    peer.on('disconnected', () => peer.reconnect());
  }
}
function joinRoom() {
  if (typeof mqtt !== 'undefined' && !mq) mq = mqtt.connect(BROKER, { reconnectPeriod: 2000, clean: true });
  if (typeof Peer === 'undefined') return;
  const peer = new Peer();
  peer.on('open', () => {
    const c = peer.connect(ROOM, { reliable: false });
    c.on('open', () => { conn = c; });
    c.on('close', () => { if (conn === c) conn = null; peer.destroy(); setTimeout(joinRoom, 1500); });
  });
  peer.on('error', (e) => { if (e.type === 'peer-unavailable' || e.type === 'network') { peer.destroy(); setTimeout(joinRoom, 3000); } });
}
if (LIVE && ROOM) joinRoom();
if (!LIVE) hostRoom();

/** 폰 → 데스크톱 한 프레임 상태. MQTT 는 1초에 30번만 (공개 브로커라 너무 잦으면 막힐 수 있음) */
let mqAt = 0;
function sendState(now) {
  if (!ROOM) return;
  const m = { n: ++seq, s: +st.s.toFixed(4), h: st.hits, k: st.k.map((k) => +k.toFixed(3)) };
  if (conn && conn.open) conn.send(m);
  if (mq && mq.connected && now - mqAt > 33) { mqAt = now; mq.publish(TOPIC(ROOM), JSON.stringify(m), { qos: 0 }); }
}
/** 데스크톱: 받은 상태를 그대로 적용. 착지 횟수가 늘면 그때 소리 (데스크톱도 한 번 클릭해 두면 소리 남) */
function applyRemote() {
  const m = remote;
  st.s += (m.s - st.s) * 0.45;   // 중계(MQTT)로 오면 1초 30번이라 그 사이를 부드럽게 이음
  for (const i of [0, 1]) if (m.h[i] !== st.hits[i]) {
    const landed = m.h[i] > st.hits[i];
    st.hits[i] = m.h[i]; st.k[i] = m.k[i];
    if (landed) sound(i, m.k[i], colorsAt(st.hits[0] + st.hits[1]).changed);
  }
}

/* ───────── 루프 ───────── */
let last = performance.now(), Lo = null;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!cw) resize();
  if (!LIVE) {   // mirror: 폰이 보내는 동안만 움직이고, 아니면 그 자리에 멈춰 있음
    const paired = remote && now - remoteAt < 1500;
    document.body.classList.toggle('paired', !!paired);
    if (paired) applyRemote();
  } else if (Lo) {
    const d = plankDir(Lo);
    let input = 0;
    if (ori && base) {
      const t = tiltOf(ori, base), dx = Math.sign(d[0] || 1) * Math.max(Math.abs(d[0]), CFG.sideways);
      input = (t[0] * dx + t[1] * d[1]) / CFG.sens;
    }
    step(dt, Math.max(-1, Math.min(1, input)), now);
    sendState(now);
  }
  Lo = draw(now);
  requestAnimationFrame(frame);
}
Promise.all([
  document.fonts.load("400 24px 'PP Radio Grotesk'").catch(() => {}),
  document.fonts.load("400 24px 'Hanken Grotesk'").catch(() => {}),
]).then(() => { resize(); requestAnimationFrame(frame); });
</script>
</body>
</html>
